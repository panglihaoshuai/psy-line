# PSY_line CI/CD Pipeline
# Runs on every push and pull request

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Stage 1: Smoke Tests (fast, catch deployment issues)
  smoke:
    name: 🔥 Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd psy_line
          pip install -e ".[dev]"
      
      - name: Run smoke tests
        run: |
          cd psy_line
          python -m pytest tests/test_smoke.py -v --tb=short

  # Stage 2: Unit Tests (fast, comprehensive)
  unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd psy_line
          pip install -e ".[dev]"
      
      - name: Run unit tests
        run: |
          cd psy_line
          python -m pytest tests/test_behavior.py tests/test_negative.py -v --tb=short

  # Stage 3: Integration Tests (moderate speed)
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd psy_line
          pip install -e ".[dev]"
      
      - name: Run integration tests
        run: |
          cd psy_line
          python -m pytest tests/test_integration.py tests/test_pipeline.py -v --tb=short

  # Stage 4: Security & Performance Tests
  security-perf:
    name: 🔒 Security & Performance
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd psy_line
          pip install -e ".[dev]"
      
      - name: Run security tests
        run: |
          cd psy_line
          python -m pytest tests/test_security.py -v --tb=short
      
      - name: Run performance tests
        run: |
          cd psy_line
          python -m pytest tests/test_performance.py -v --tb=short -m "not slow"

  # Stage 5: Acceptance Tests (slower, comprehensive)
  acceptance:
    name: ✅ Acceptance Tests
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd psy_line
          pip install -e ".[dev]"
      
      - name: Run acceptance tests
        run: |
          cd psy_line
          python -m pytest tests/test_acceptance.py -v --tb=short

  # Final: All Tests Summary
  all-tests:
    name: 📊 All Tests Summary
    runs-on: ubuntu-latest
    needs: [smoke, unit, integration, security-perf, acceptance]
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "=== Test Pipeline Summary ==="
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Unit: ${{ needs.unit.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          echo "Security & Performance: ${{ needs.security-perf.result }}"
          echo "Acceptance: ${{ needs.acceptance.result }}"
          
          # Fail if any job failed
          if [[ "${{ needs.smoke.result }}" == "failure" || 
                "${{ needs.unit.result }}" == "failure" || 
                "${{ needs.integration.result }}" == "failure" || 
                "${{ needs.security-perf.result }}" == "failure" || 
                "${{ needs.acceptance.result }}" == "failure" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi
          echo "✅ All tests passed!"

  # Lint & Type Check
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd psy_line
          pip install -e ".[dev]"
          pip install ruff mypy
      
      - name: Run ruff lint
        run: |
          cd psy_line
          ruff check src/ tests/ --output-format=github
      
      - name: Run ruff format check
        run: |
          cd psy_line
          ruff format --check src/ tests/
      
      - name: Run mypy type check
        run: |
          cd psy_line
          mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # mypy might fail initially

  # Build & Package
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: [smoke, lint]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install build tools
        run: pip install build
      
      - name: Build package
        run: |
          cd psy_line
          python -m build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: psy_line/dist/
